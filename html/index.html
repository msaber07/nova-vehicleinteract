<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css?v=9" />
  <title>Nova Vehicle Menu</title>
</head>
<body>
  <main id="app" class="hidden">
    <div id="popover" class="popover hidden">
      <p id="popover-title"></p>
      <div id="popover-body"></div>
    </div>
    <div id="dock">
      <div id="brand">
        <strong id="title">VEHICLE</strong>
        <span id="header-plate"></span>
      </div>
      <div id="tools"></div>
      <button id="close" type="button">Exit</button>
    </div>
  </main>
  <script src="js/app.js?v=11"></script>
</body>
</html>
